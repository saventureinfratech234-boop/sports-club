<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Thank You | Harish Sports Club</title>

<link rel="stylesheet" href="style.css">

<style>

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f5f7fa;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.box{

    background:#fff;
    width:500px;
    max-width:90%;
    padding:50px;
    text-align:center;
    border-radius:15px;
    box-shadow:0 15px 40px rgba(0,0,0,.15);

}

h1{

    color:#0d2b45;
    font-size:40px;
    margin-bottom:15px;

}

p{

    font-size:18px;
    color:#555;
    line-height:1.7;

}

a{

    display:inline-block;
    margin-top:30px;
    background:#0d2b45;
    color:#fff;
    padding:14px 35px;
    text-decoration:none;
    border-radius:8px;
    transition:.3s;

}

a:hover{

    background:#144c78;

}

.check{

    font-size:70px;
    color:green;

}

</style>

</head>

<body>

<div class="box">

<div class="check">✅</div>

<h1>Thank You!!</h1>

<p>

Your club booking request has been submitted successfully.

<br><br>

Our team will contact you shortly.

</p>

<a href="index.html">

Back to Home

</a>

</div>

</body>

</html>
